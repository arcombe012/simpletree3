[build-system]
requires = ["setuptools >= 82.0"]
build-backend = "setuptools.build_meta"

[project]
name = "simpletree3"
authors = [{"name" = "arcombe012"}]
description = "A simple tree structure and associated search/iteration tools for python 3.10+."
requires-python = ">=3.10"
readme = {file = "README.rst", content-type = "text/x-rst"}
keywords = [
    "tree",
    "tree structure",
    "python3 tree class"
    ]
license = "Apache-2.0"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
    "Operating System :: OS Independent",
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules"
    ]
dynamic = ["version"]

[project.urls]
source = "https://github.com/arcombe012/simpletree3.git"

[dependency-groups]
dev = [
    "pytest>=9.0",
    "coverage>=7.14",
    "pytest-cov>=7.1",
    "setuptools>=82.0.1",
    "twine",
    "build",
    "ruff",
    "mypy",
]

[tool.setuptools]
packages = ["simpletree3"]

[tool.setuptools.package-data]
simpletree3 = ["py.typed"]

[tool.setuptools.dynamic]
version = {attr = "simpletree3.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["simpletree3"]

[tool.coverage.report]
exclude_also = ["@abstractmethod"]
